aid: nawy
name: Nawy
description: 'Nawy is an Egyptian proptech real estate marketplace that lets users buy, sell,
  rent, and invest in premium property across Egypt, listing 15,000+ properties and 800+ compounds
  with search, virtual tours, mortgage financing, and its "Nawy Now" instant-purchase and part-exchange
  offerings. It operates a consumer-facing web and mobile marketplace connecting buyers, sellers,
  and developers; it was surfaced as a portfolio company of Partech and added to the API Evangelist
  network. No public developer program, API documentation, or partner integration surface is
  published as of this enrichment pass.'
